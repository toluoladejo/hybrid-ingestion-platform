name: destroy

# Manual only: deletes everything Terraform created for one environment, so the
# next deploy starts from scratch. Run it from Actions > destroy > Run workflow.
#
# Kept: the resource group itself (Terraform only reads it), the tfstate storage
# from scripts/bootstrap.sh, and the OIDC app/role assignments. The Key Vault is
# soft-deleted for 7 days; the next apply recovers it automatically.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        required: true
        type: choice
        options: [dev, prod]
      confirm:
        description: Type the environment name again to confirm
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy:
    if: inputs.confirm == inputs.environment
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="key=${{ inputs.environment }}.tfstate"
      - name: Resources that will be deleted
        run: terraform state list || true

      # A trigger left behind by a failed apply is not in state, so Terraform never
      # deletes it, and ADF refuses to delete a pipeline a trigger still references.
      # Stop and delete every trigger in the env's data factories first.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Delete ADF triggers
        env:
          RG: rg-ingest-${{ inputs.environment }}
        run: |
          api=api-version=2018-06-01
          for adf in $(az resource list -g "$RG" --resource-type Microsoft.DataFactory/factories --query '[].id' -o tsv); do
            for t in $(az rest --method get --url "https://management.azure.com$adf/triggers?$api" --query 'value[].name' -o tsv); do
              echo "Stopping and deleting trigger $t in ${adf##*/}"
              az rest --method post --url "https://management.azure.com$adf/triggers/$t/stop?$api" -o none || true
              az rest --method delete --url "https://management.azure.com$adf/triggers/$t?$api" -o none
            done
          done
      # Never try to adopt anything while tearing down. Passed as a var file (not -var)
      # so copies of the repo that removed the variable only get a warning, not an error.
      #
      # Retries: deleting the Synapse workspace is polled at subscription scope
      # (Microsoft.Synapse/locations/operationStatuses/read), which an identity that is
      # Contributor on the resource group only cannot read, so Terraform gives up while
      # Azure keeps deleting. The next attempt refreshes, sees it gone, and carries on.
      - run: |
          echo 'import_landing_trigger = false' > "$RUNNER_TEMP/destroy.tfvars"
          for attempt in 1 2 3 4; do
            if terraform destroy -input=false -auto-approve \
                 -var-file=env/${{ inputs.environment }}.tfvars \
                 -var-file="$RUNNER_TEMP/destroy.tfvars"; then
              exit 0
            fi
            [ "$attempt" = 4 ] && break
            echo "::warning::Destroy attempt $attempt failed; waiting 5 min for Azure to finish deleting, then retrying."
            sleep 300
          done
          exit 1
      - name: Confirm state is empty
        run: |
          left=$(terraform state list)
          if [ -n "$left" ]; then echo "Still in state:"; echo "$left"; exit 1; fi
          echo "All Terraform-managed resources are gone."

  refused:
    if: inputs.confirm != inputs.environment
    runs-on: ubuntu-latest
    steps:
      - env:
          CONFIRM: ${{ inputs.confirm }}
          TARGET: ${{ inputs.environment }}
        run: |
          echo "::error::Confirmation '$CONFIRM' does not match '$TARGET'. Nothing was destroyed."
          exit 1       
          