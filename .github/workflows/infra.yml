name: infra

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml', '.github/workflows/deploy.yml']
  push:
    branches: [dev, prod]
    paths: ['infra/**', '.github/workflows/infra.yml', '.github/workflows/deploy.yml']

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="key=dev.tfstate"
      - run: terraform validate
      - run: terraform plan -input=false -lock=false -var-file=env/dev.tfvars

  deploy-dev:
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with: { environment: dev }

  deploy-prod:
    needs: deploy-dev
    uses: ./.github/workflows/deploy.yml
    with: { environment: prod } # the prod environment requires a reviewer
