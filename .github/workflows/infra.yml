name: infra

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml', '.github/workflows/deploy.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml', '.github/workflows/deploy.yml']

permissions:
  id-token: write
  contents: read

jobs:
  what-if:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az bicep lint --file infra/main.bicep
      - run: |
          az deployment group what-if -g rg-ingest-dev \
            -f infra/main.bicep -p infra/dev.bicepparam

  deploy-dev:
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with: { environment: dev }

  deploy-prod:
    needs: deploy-dev
    uses: ./.github/workflows/deploy.yml
    with: { environment: prod } # the prod environment requires a reviewer
