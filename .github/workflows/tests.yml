name: tests

on:
  pull_request:
    paths: ['synapse/**', 'pipelines/**', 'tests/**', 'samples/**', 'requirements-dev.txt']
  push:
    branches: [main]
    paths: ['synapse/**', 'pipelines/**', 'tests/**', 'samples/**', 'requirements-dev.txt']

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
